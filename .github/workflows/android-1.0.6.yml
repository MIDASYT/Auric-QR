name: Auric QR Android 1.0.6 - APK de prueba

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'auric-qr-android-1.0.6.zip'
      - '.github/workflows/android-1.0.6.yml'

permissions:
  contents: read

jobs:
  compilar-android:
    name: Compilar y comprobar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extraer el proyecto Android
        shell: bash
        run: |
          set -euo pipefail
          test -s auric-qr-android-1.0.6.zip
          unzip -Z1 auric-qr-android-1.0.6.zip | grep -q '^Android/app/build.gradle$'
          unzip -q auric-qr-android-1.0.6.zip
          test -f Android/app/src/main/AndroidManifest.xml
          test -f Android/app/src/main/assets/index.html
          test -f Android/app/src/main/java/io/auric/qr/MainActivity.java
          # Corrige las importaciones de ZXing Embedded 4.3.0 durante la compilación.
          sed -i 's/com.journeyapps.barcodescanner.IntentIntegrator/com.google.zxing.integration.android.IntentIntegrator/' Android/app/src/main/java/io/auric/qr/MainActivity.java
          sed -i 's/com.journeyapps.barcodescanner.IntentResult/com.google.zxing.integration.android.IntentResult/' Android/app/src/main/java/io/auric/qr/MainActivity.java
          grep -q 'import com.google.zxing.integration.android.IntentIntegrator;' Android/app/src/main/java/io/auric/qr/MainActivity.java
          echo 'Proyecto Android localizado y preparado.'

      - name: Compilar APK de depuración
        working-directory: Android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Preparar archivo con nombre de versión
        shell: bash
        run: |
          set -euo pipefail
          test -s Android/app/build/outputs/apk/debug/app-debug.apk
          cp Android/app/build/outputs/apk/debug/app-debug.apk Auric-QR-Android-1.0.6-PRUEBA.apk
          sha256sum Auric-QR-Android-1.0.6-PRUEBA.apk

      - name: Guardar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Auric-QR-Android-1.0.6-PRUEBA
          path: Auric-QR-Android-1.0.6-PRUEBA.apk
          if-no-files-found: error
          retention-days: 30
